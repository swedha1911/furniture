<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Furniture Shop Login</title>

    <link rel="stylesheet"
        href="css/style.css">

    <script src="js/script.js"></script>

</head>

<body>

    <div class="furniture-background">

        <div class="furniture furniture1">🛋️</div>
        <div class="furniture furniture2">🪑</div>
        <div class="furniture furniture3">🛏️</div>
        <div class="furniture furniture4">🪴</div>
        <div class="furniture furniture5">🪞</div>
        <div class="furniture furniture6">💡</div>
        <div class="furniture furniture7">🛋️</div>


        <div class="login-box">

            <div class="login-logo">
                🏠
            </div>

            <h1>LIVORA FURNITURE</h1>

            <p>
                Live Beautifully. Feel at Home.<br>
                Welcome back!
            </p>

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button onclick="login()">
                LOGIN
            </button>

            <small>
                Comfort • Style • Quality
            </small>

        </div>

    </div>

</body>

</html>
