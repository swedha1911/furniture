<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<link rel="stylesheet"
    href="css/style.css">


<style>

    .my-checkout-page {

        min-height: 100vh;
        padding: 40px 20px;
        background: #f5f1ed;

    }


    .my-checkout-box {

        max-width: 900px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);

    }


    .my-checkout-title {

        text-align: center;
        color: brown;
        margin-bottom: 30px;

    }


    .checkout-section {

        margin-bottom: 30px;

    }


    .checkout-section h3 {

        color: brown;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;

    }


    .customer-input {

        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-top: 8px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;

    }


    .customer-address {

        width: 100%;
        box-sizing: border-box;
        min-height: 100px;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;

    }


    .my-checkout-item {

        display: flex;
        align-items: center;
        gap: 20px;
        padding: 15px;
        margin-bottom: 15px;
        background: #fafafa;
        border-radius: 10px;

    }


    .my-checkout-item img {

        width: 120px;
        height: 90px;
        object-fit: cover;
        border-radius: 8px;

    }


    .checkout-product-info {

        flex: 1;

    }


    .checkout-product-info h4 {

        margin: 0 0 10px 0;

    }


    .my-price-details {

        background: #fafafa;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;

    }


    .my-price-details p {

        display: flex;
        justify-content: space-between;

    }


    .payment-option {

        display: block;
        padding: 12px;
        margin-bottom: 10px;
        background: #fafafa;
        border-radius: 7px;
        cursor: pointer;

    }


    .payment-option input {

        margin-right: 10px;

    }


    .payment-box {

        margin-top: 15px;
        padding: 20px;
        background: #f7f7f7;
        border-radius: 10px;
        border: 1px solid #ddd;

    }


    .payment-box input,
    .payment-box select {

        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;

    }


    .place-order-btn {

        width: 100%;
        padding: 15px;
        background: brown !important;
        color: white !important;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        cursor: pointer;

    }


    .place-order-btn:hover {

        background: #5c3317 !important;

    }


    @media(max-width: 600px) {

        .my-checkout-box {

            padding: 20px;

        }


        .my-checkout-item {

            flex-direction: column;
            text-align: center;

        }


        .my-checkout-item img {

            width: 100%;
            height: 180px;

        }

    }

</style>
```

</head>

<body>


<!-- Header -->

<header class="header">

    <h1>Livora Furniture</h1>

    <div class="top-icons">

        <a href="home.html" class="icon-btn">🏠</a>

        <a href="cart.html" class="icon-btn">🛒</a>

        <a href="account.html" class="icon-btn">👤</a>

        <a href="settings.html" class="icon-btn">⚙️</a>

    </div>

</header>


<!-- Checkout Page -->

<div class="my-checkout-page">

    <div class="my-checkout-box">


        <h2 class="my-checkout-title">

            Checkout

        </h2>



        <!-- Customer Details -->

        <div class="checkout-section">

            <h3>Customer Details</h3>


            <label>Name:</label>

            <input
                class="customer-input"
                type="text"
                id="customerName"
                placeholder="Enter your name"
            >


            <label>Phone Number:</label>

            <input
                class="customer-input"
                type="tel"
                id="phone"
                placeholder="Enter phone number"
            >


            <label>Address:</label>

            <textarea
                class="customer-address"
                id="address"
                placeholder="Enter your address"
            ></textarea>

        </div>



        <!-- Order Summary -->

        <div class="checkout-section">

            <h3>Order Summary</h3>

            <div id="orderItems"></div>


            <!-- Price Details -->

            <div class="my-price-details">

                <p>

                    <span>Product Price</span>

                    <span>
                        ₹<span id="productTotal">0</span>
                    </span>

                </p>


                <p>

                    <span>Shipping Charge</span>

                    <span>
                        ₹<span id="shippingCharge">99</span>
                    </span>

                </p>


                <p>

                    <span>Platform Fee</span>

                    <span>
                        ₹<span id="platformFee">49</span>
                    </span>

                </p>


                <hr>


                <h2>

                    Grand Total:
                    ₹<span id="grandTotal">0</span>

                </h2>

            </div>

        </div>



        <!-- Payment Method -->

        <div class="checkout-section">

            <h3>Payment Method</h3>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="Cash on Delivery"
                    onchange="showPayment('COD')"
                >

                Cash on Delivery

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="GPay"
                    onchange="showPayment('GPay')"
                >

                GPay

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="PhonePe"
                    onchange="showPayment('PhonePe')"
                >

                PhonePe

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="UPI"
                    onchange="showPayment('UPI')"
                >

                UPI

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="Wallet"
                    onchange="showPayment('Wallet')"
                >

                Wallet

            </label>


            <!-- Payment Details -->

            <div id="paymentDetails"></div>

        </div>



        <!-- Place Order -->

        <button
            class="place-order-btn"
            onclick="placeOrder()"
        >

            Place Order

        </button>


    </div>

</div>



<script>


    /* ============================= */
    /* GET CART */
    /* ============================= */


    var cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    /* ============================= */
    /* CHARGES */
    /* ============================= */


    var shippingCharge = 99;

    var platformFee = 49;

    var productTotal = 0;

    var grandTotal = 0;



    /* ============================= */
    /* DISPLAY ORDER */
    /* ============================= */


    function displayOrder() {


        var orderItems =
            document.getElementById(
                "orderItems"
            );


        orderItems.innerHTML = "";


        if (cart.length === 0) {

            orderItems.innerHTML =
                "<p>Your cart is empty.</p>";

            return;

        }


        productTotal = 0;


        cart.forEach(function(item) {


            var price =
                parseInt(
                    item.price
                    .replace("₹", "")
                    .replace(/,/g, "")
                );


            var total =
                price * item.quantity;


            productTotal += total;


            orderItems.innerHTML += `

                <div class="my-checkout-item">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >


                    <div class="checkout-product-info">

                        <h4>
                            ${item.name}
                        </h4>


                        <p>
                            Price:
                            ${item.price}
                        </p>


                        <p>
                            Quantity:
                            ${item.quantity}
                        </p>


                        <strong>

                            Item Total:
                            ₹${total.toLocaleString("en-IN")}

                        </strong>

                    </div>

                </div>

            `;

        });


        grandTotal =
            productTotal +
            shippingCharge +
            platformFee;


        document.getElementById(
            "productTotal"
        ).innerText =
            productTotal.toLocaleString("en-IN");


        document.getElementById(
            "grandTotal"
        ).innerText =
            grandTotal.toLocaleString("en-IN");

    }



    /* ============================= */
    /* PAYMENT OPTIONS */
    /* ============================= */


    function showPayment(method) {


        var paymentDetails =
            document.getElementById(
                "paymentDetails"
            );


        paymentDetails.innerHTML = "";


        if (method === "COD") {

            paymentDetails.innerHTML = `

                <div class="payment-box">

                    <h4>
                        Cash on Delivery
                    </h4>

                    <p>
                        Pay at the time of delivery.
                    </p>

                    <p>

                        Amount to Pay:

                        <strong>
                            ₹${grandTotal.toLocaleString("en-IN")}
                        </strong>

                    </p>

                </div>

            `;

        }


        else if (method === "GPay") {

            paymentDetails.innerHTML = `

                <div class="payment-box">

                    <h4>
                        GPay Payment
                    </h4>

                    <p>

                        Amount to Pay:
                        ₹${grandTotal.toLocaleString("en-IN")}

                    </p>

                    <label>
                        Enter UPI ID:
                    </label>

                    <input
                        type="text"
                        id="gpayUPI"
                        placeholder="example@upi"
                    >

                </div>

            `;

        }


        else if (method === "PhonePe") {

            paymentDetails.innerHTML = `

                <div class="payment-box">

                    <h4>
                        PhonePe Payment
                    </h4>

                    <p>

                        Amount to Pay:
                        ₹${grandTotal.toLocaleString("en-IN")}

                    </p>

                    <label>
                        Enter UPI ID:
                    </label>

                    <input
                        type="text"
                        id="phonepeUPI"
                        placeholder="example@ybl"
                    >

                </div>

            `;

        }


        else if (method === "UPI") {

            paymentDetails.innerHTML = `

                <div class="payment-box">

                    <h4>
                        UPI Payment
                    </h4>

                    <p>

                        Amount to Pay:
                        ₹${grandTotal.toLocaleString("en-IN")}

                    </p>

                    <label>
                        Enter UPI ID:
                    </label>

                    <input
                        type="text"
                        id="upiID"
                        placeholder="example@upi"
                    >

                </div>

            `;

        }


        else if (method === "Wallet") {

            paymentDetails.innerHTML = `

                <div class="payment-box">

                    <h4>
                        Wallet Payment
                    </h4>

                    <p>

                        Amount to Pay:
                        ₹${grandTotal.toLocaleString("en-IN")}

                    </p>

                    <label>
                        Select Wallet:
                    </label>


                    <select id="wallet">

                        <option value="">
                            Select Wallet
                        </option>

                        <option value="Paytm">
                            Paytm
                        </option>

                        <option value="Amazon Pay">
                            Amazon Pay
                        </option>

                        <option value="Mobikwik">
                            Mobikwik
                        </option>

                    </select>


                    <br><br>


                    <label>
                        Mobile Number:
                    </label>


                    <input
                        type="tel"
                        id="walletPhone"
                        placeholder="Enter mobile number"
                    >

                </div>

            `;

        }

    }



    /* ============================= */
    /* PLACE ORDER */
    /* ============================= */


    function placeOrder() {


        var name =
            document.getElementById(
                "customerName"
            ).value.trim();


        var phone =
            document.getElementById(
                "phone"
            ).value.trim();


        var address =
            document.getElementById(
                "address"
            ).value.trim();


        var payment =
            document.querySelector(
                'input[name="payment"]:checked'
            );


        if (name === "") {

            alert(
                "Please enter your name."
            );

            return;

        }


        if (phone === "") {

            alert(
                "Please enter your phone number."
            );

            return;

        }


        if (address === "") {

            alert(
                "Please enter your address."
            );

            return;

        }


        if (cart.length === 0) {

            alert(
                "Your cart is empty."
            );

            return;

        }


        if (!payment) {

            alert(
                "Please select a payment method."
            );

            return;

        }


        if (payment.value === "GPay") {

            var gpay =
                document.getElementById(
                    "gpayUPI"
                ).value.trim();


            if (gpay === "") {

                alert(
                    "Please enter your GPay UPI ID."
                );

                return;

            }

        }


        if (payment.value === "PhonePe") {

            var phonepe =
                document.getElementById(
                    "phonepeUPI"
                ).value.trim();


            if (phonepe === "") {

                alert(
                    "Please enter your PhonePe UPI ID."
                );

                return;

            }

        }


        if (payment.value === "UPI") {

            var upi =
                document.getElementById(
                    "upiID"
                ).value.trim();


            if (upi === "") {

                alert(
                    "Please enter your UPI ID."
                );

                return;

            }

        }


        if (payment.value === "Wallet") {

            var wallet =
                document.getElementById(
                    "wallet"
                ).value;


            var walletPhone =
                document.getElementById(
                    "walletPhone"
                ).value.trim();


            if (wallet === "") {

                alert(
                    "Please select a wallet."
                );

                return;

            }


            if (walletPhone === "") {

                alert(
                    "Please enter your mobile number."
                );

                return;

            }

        }


        /* Generate Order ID */

        var orderID =
            "FS" + Date.now();


        /* Expected Delivery */

        var deliveryDate =
            new Date();


        deliveryDate.setDate(
            deliveryDate.getDate() + 5
        );


        var expectedDate =
            deliveryDate.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );


        /* Save Order */

        var order = {

            orderID: orderID,

            name: name,

            phone: phone,

            address: address,

            items: cart,

            productTotal: productTotal,

            shippingCharge: shippingCharge,

            platformFee: platformFee,

            grandTotal: grandTotal,

            paymentMethod: payment.value,

            status: "Order Confirmed",

            expectedDate: expectedDate,

            orderTime: Date.now()

        };


        localStorage.setItem(
            "lastOrder",
            JSON.stringify(order)
        );


        /* Clear Cart */

        localStorage.removeItem(
            "cart"
        );


        /* Go to Success Page */

        window.location.href =
            "success.html";

    }



    /* LOAD ORDER */

    displayOrder();


</script>
```

</body>

</html>
