<script>

function updateCartCount() {

    var cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    var totalItems = 0;

    for (var i = 0; i < cart.length; i++) {

        totalItems = totalItems + Number(cart[i].quantity);

    }

    var cartCount =
        document.getElementById("cartCount");

    if (cartCount) {

        cartCount.innerText = totalItems;

    }

}


/* Page open ஆகும்போது */

updateCartCount();


/* Home page திரும்பும்போது update ஆக */

window.addEventListener(
    "focus",
    updateCartCount
);


/* Page visible ஆனாலும் update ஆக */

document.addEventListener(
    "visibilitychange",
    function() {

        if (!document.hidden) {

            updateCartCount();

        }

    }
);

</script>

<script>


    /* =====================
       SETTINGS DROPDOWN
    ===================== */

    function toggleSettings(){

        document
            .getElementById("settingsDropdown")
            .classList
            .toggle("show");

    }



    /* =====================
       SEARCH FURNITURE
    ===================== */

    function searchFurniture(){

        var search =
            document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


        if(search == ""){

            alert("Please enter furniture name");

        }


        else if(search.includes("sofa")){

            location.href = "sofa.html";

        }


        else if(search.includes("chair")){

            location.href = "chair.html";

        }


        else if(search.includes("bed")){

            location.href = "bed.html";

        }


        else if(search.includes("dining")){

            location.href = "dining.html";

        }


        else if(search.includes("wardrobe")){

            location.href = "wardrobe.html";

        }


        else if(
            search.includes("tv") ||
            search.includes("tv unit")
        ){

            location.href = "tv.html";

        }


        else{

            alert("Furniture not found");

        }

    }


    /* Enter key for search */

    document
        .getElementById("searchInput")
        .addEventListener(
            "keypress",
            function(event){

                if(event.key === "Enter"){

                    searchFurniture();

                }

            }
        );

</script>
